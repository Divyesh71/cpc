<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 667" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F3F9FD"/>
      <stop offset="1" stop-color="#E6F3FA"/>
    </linearGradient>
    <linearGradient id="vb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FD"/>
      <stop offset=".6" stop-color="#BFE2F4"/>
      <stop offset="1" stop-color="#9ED2EC"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#CBE9F7" stop-opacity=".35"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.6" fill="#A9D8EE"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="2000" height="667" fill="url(#bg)"/>

  <!-- soft orbs -->
  <circle cx="110" cy="330" r="230" fill="url(#orb)"/>
  <circle cx="-40" cy="150" r="300" fill="#DDF0FA" fill-opacity=".45"/>
  <circle cx="1700" cy="610" r="260" fill="#DDF0FA" fill-opacity=".5"/>

  <!-- arcs + nodes (left) -->
  <path d="M0 58 C 110 70 190 150 183 292" fill="none" stroke="#9FD3EC" stroke-width="2" stroke-opacity=".8"/>
  <circle cx="170" cy="226" r="8" fill="#5FB9E3"/>
  <circle cx="94" cy="543" r="14" fill="#7CC4E8"/>
  <circle cx="395" cy="140" r="8" fill="#BBE0F2"/>

  <!-- dot grids -->
  <rect x="170" y="430" width="100" height="95" fill="url(#dots)" opacity=".55"/>
  <rect x="1585" y="78" width="96" height="95" fill="url(#dots)" opacity=".5"/>

  <!-- stylised vertebral column (right) -->
  <g filter="url(#soft)" opacity=".7">
    <g fill="url(#vb)">
      <g transform="translate(1790 -10) rotate(8)">
        <rect x="0" y="0" width="118" height="50" rx="24"/>
        <rect x="74" y="-18" width="52" height="22" rx="11"/>
      </g>
      <g transform="translate(1784 58) rotate(8)">
        <rect x="0" y="0" width="122" height="52" rx="25"/>
        <rect x="78" y="-14" width="54" height="22" rx="11"/>
      </g>
      <g transform="translate(1778 128) rotate(7)">
        <rect x="0" y="0" width="126" height="54" rx="26"/>
        <rect x="82" y="-14" width="56" height="22" rx="11"/>
      </g>
      <g transform="translate(1776 200) rotate(5)">
        <rect x="0" y="0" width="130" height="56" rx="27"/>
        <rect x="86" y="-14" width="58" height="22" rx="11"/>
      </g>
      <g transform="translate(1778 274) rotate(2)">
        <rect x="0" y="0" width="134" height="58" rx="28"/>
        <rect x="90" y="-14" width="60" height="22" rx="11"/>
      </g>
      <g transform="translate(1786 350) rotate(-2)">
        <rect x="0" y="0" width="136" height="60" rx="29"/>
        <rect x="92" y="-14" width="60" height="22" rx="11"/>
      </g>
      <g transform="translate(1798 428) rotate(-6)">
        <rect x="0" y="0" width="138" height="62" rx="30"/>
        <rect x="94" y="-14" width="60" height="22" rx="11"/>
      </g>
      <g transform="translate(1814 508) rotate(-9)">
        <rect x="0" y="0" width="140" height="64" rx="31"/>
        <rect x="96" y="-14" width="60" height="22" rx="11"/>
      </g>
      <g transform="translate(1834 590) rotate(-12)">
        <rect x="0" y="0" width="142" height="66" rx="32"/>
      </g>
    </g>
  </g>
  <circle cx="1910" cy="486" r="19" fill="#7CC4E8" fill-opacity=".85"/>
  <circle cx="1560" cy="72" r="9" fill="#C8E7F5"/>
</svg>
